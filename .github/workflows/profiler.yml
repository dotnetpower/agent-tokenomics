name: profiler

on:
  push:
    branches: [main]
    paths:
      - "profiler/**"
      - ".github/workflows/profiler.yml"
  pull_request:
    paths:
      - "profiler/**"
      - ".github/workflows/profiler.yml"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    defaults:
      run:
        working-directory: profiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and integration tests
        run: python -m pytest
      - name: Self test (mock LLM through the gateway)
        run: python -m tokprof selftest

  ebpf-helper:
    name: ebpf helper (go build, vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: profiler/ebpf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go build -o bin/tokprof-ebpf ./cmd/tokprof-ebpf
      - run: ./bin/tokprof-ebpf inspect | tail -2
