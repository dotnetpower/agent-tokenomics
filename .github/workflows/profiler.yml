name: profiler

on:
  push:
    branches: [main]
    paths:
      - "profiler/**"
      - ".github/workflows/profiler.yml"
  pull_request:
    paths:
      - "profiler/**"
      - ".github/workflows/profiler.yml"

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: profiler
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "profiler -> target"
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Self test (mock LLM through the gateway)
        shell: bash
        run: ./target/release/tokprof selftest

  ebpf-helper:
    name: ebpf helper (build, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: profiler/ebpf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: profiler/ebpf/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/tokprof-ebpf ./cmd/tokprof-ebpf
      - run: ./bin/tokprof-ebpf inspect | tail -2
      - name: Cross-build and vet for other targets
        run: |
          GOARCH=arm64 go vet ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=windows go build ./...

  ebpf-e2e:
    name: ebpf e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: profiler/ebpf/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "profiler -> target"
      - name: Build Rust tokprof binary
        working-directory: profiler
        run: cargo build --release
      - name: Build helper
        working-directory: profiler/ebpf
        run: go build -o bin/tokprof-ebpf ./cmd/tokprof-ebpf
      - name: Kernel facts
        run: uname -r; ls /sys/kernel/btf/vmlinux
      - name: Capture real TLS clients (python, node, curl) with the probes
        working-directory: profiler/ebpf
        run: sudo -E env "PATH=$PATH" python3 e2e/run_e2e.py --helper bin/tokprof-ebpf
      - name: Same through `tokprof ebpf`
        working-directory: profiler/ebpf
        run: sudo -E env "PATH=$PATH" python3 e2e/run_e2e.py --helper bin/tokprof-ebpf --tokprof
      - name: Probes are removed when the helper is killed
        working-directory: profiler/ebpf
        run: sudo -E env "PATH=$PATH" python3 e2e/crash_cleanup.py --helper bin/tokprof-ebpf
