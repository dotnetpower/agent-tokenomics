[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "tokprof"
version = "0.4.0"
description = "Zero-code LLM agent token profiler (native Rust single-binary implementation)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["llm", "tokens", "profiler", "agents", "openai", "anthropic", "ebpf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://dotnetpower.github.io/agent-tokenomics/"
Documentation = "https://dotnetpower.github.io/agent-tokenomics/agent-tokenomics/tokprof/"
Repository = "https://github.com/dotnetpower/agent-tokenomics/tree/main/profiler"
Issues = "https://github.com/dotnetpower/agent-tokenomics/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
include = [
  { path = "boot/*", format = "sdist" },
  { path = "ebpf/**/*", format = "sdist" },
  { path = "tests/**/*", format = "sdist" },
  { path = "README.md", format = "sdist" },
]
